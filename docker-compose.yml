services:
  bridge:
    build: .
    image: am-statuspage-bridge:latest
    restart: unless-stopped
    ports:
      - "${BRIDGE_PORT:-9090}:${BRIDGE_PORT:-9090}"
    env_file:
      - .env
    environment:
      INCIDENTS_STORE_PATH: /app/data/incidents_store.json
    volumes:
      - incidents_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request as u; u.urlopen('http://localhost:' + os.environ.get('BRIDGE_PORT', '9090') + '/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  incidents_data:
