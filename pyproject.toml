[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
# Kept generous mainly because of descriptive log f-strings; splitting those
# across lines would hurt readability more than it helps.
line-length = 165
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
